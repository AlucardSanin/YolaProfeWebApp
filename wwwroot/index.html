<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website de Fonética I · UNEFM</title>
    <meta name="description" content="Plataforma de entrenamiento fonético para estudiantes de Inglés como Lengua Extranjera de la UNEFM Carirubana." />
    <meta name="theme-color" content="#1d4f91" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="contenido/imagenes/logo-unefm.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="carga-inicial" role="status">
            <img src="contenido/imagenes/logo-unefm.png" alt="" width="50" height="76" />
            <span class="carga-titulo">Website de Fonética I</span>
            <div class="carga-barra" aria-hidden="true"><span></span></div>
            <span>Cargando la plataforma… La primera visita puede tardar un poco; las siguientes serán más rápidas.</span>
        </div>
    </div>

    <noscript>Esta plataforma necesita JavaScript activado en el navegador.</noscript>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar la página</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
